name: WireGuard Sydney Sunucu
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik yeniden başlatır (kapanmasın diye)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5 saat 50 dakika çalışır
    steps:
      - uses: actions/checkout@v3
      
      - name: WireGuard Kurulumu ve Başlatma
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard qrencode curl
          
          # WireGuard ayarları
          umask 077
          wg genkey | tee privatekey | wg pubkey > publickey
          PRIV=$(cat privatekey)
          PUB=$(cat publickey)

          cat > wg0.conf <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = $PRIV
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
          EOF

          sudo sysctl -w net.ipv4.ip_forward=1
          sudo cp wg0.conf /etc/wireguard/wg0.conf
          
          # İstemci ayarları
          wg genkey | tee client_privatekey | wg pubkey > client_publickey
          CLI_PRIV=$(cat client_privatekey)
          CLI_PUB=$(cat client_publickey)
          
          IP=$(curl -s ifconfig.me)
          
          cat > iphone.conf <<EOF
          [Interface]
          PrivateKey = $CLI_PRIV
          Address = 10.66.66.2/32
          DNS = 1.1.1.1, 8.8.8.8
          [Peer]
          PublicKey = $PUB
          Endpoint = $IP:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          sudo wg-quick up wg0
          
          echo "=== IPHONE CONFIG BURADA (Kopyala) ==="
          cat iphone.conf
          echo "======================================"
          
          # Sunucuyu 5 saat 40 dakika açık tut (Actions limitine kadar)
          sleep 340m
